:root {

  --panel-hi:     #2B2238;
  --rule:         #2B2238;
  --rule-2:       #3C3050;
  --ink:          #F2EAF5;
  --ink-2:        #C8B8D4;
  --ink-3:        #8C7898;
  --ink-4:        #5C4E68;
  --up:           #7AB888;
  --up-2:         #4A8858;
  --down:         #E87878;
  --down-2:       #A84848;
  --warn:         #D4A060;
  --info:         #6AAABB;
  --magenta:      #D080A8;
  --accent:       #D07090;
  --accent-2:     #A85070;
  --pad:           16px;
  --pad-tight:     10px;
  --pad-loose:     24px;
  --gap:           1px;
  --row-h:         32px;
  --sans: 'Geist', 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  --serif: 'Newsreader', 'Source Serif Pro', Georgia, serif;
  --fs-xs:    11px;
  --fs-sm:    12px;
  --fs-base:  13px;
  --fs-md:    14px;
  --fs-lg:    16px;
  --fs-xl:    20px;
  --fs-2xl:   28px;
  --fs-3xl:   44px;
  --fs-4xl:   64px;
}
[data-density="compact"] {
  --pad: 12px; --pad-tight: 8px; --pad-loose: 18px; --row-h: 26px;
  --fs-base: 12px; --fs-md: 13px; --fs-lg: 15px; --fs-xl: 18px; --fs-2xl: 24px; --fs-3xl: 36px; --fs-4xl: 52px;
}
[data-density="spacious"] {
  --pad: 22px; --pad-tight: 14px; --pad-loose: 32px; --row-h: 36px;
  --fs-base: 14px; --fs-md: 15px; --fs-lg: 18px; --fs-xl: 24px; --fs-2xl: 32px; --fs-3xl: 52px; --fs-4xl: 76px;
}
[data-theme="light"] {
  --bg: #FAF0F6; --bg-1: #F4E8F2; --panel: #FEFAFD; --panel-2: #F8EEF6; --panel-hi: #EFE2EE;
  --rule: #E6D4E4; --rule-2: #CEB8CC;
  --ink: #1A0E18; --ink-2: #3E2A3C; --ink-3: #6E5A6C; --ink-4: #9E8C9C;
  --up: #3A7848; --up-2: #285836; --down: #C04858; --down-2: #883040;
  --warn: #A07030; --info: #2A7888; --magenta: #A04080;
  --accent: #C05878; --accent-2: #904060;
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: var(--fs-base);
  font-feature-settings: "ss01","cv11";
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font-family: inherit; color: inherit; }
table { border-collapse: collapse; width: 100%; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }
.mono { font-family: var(--mono); font-feature-settings: "tnum","zero"; }
.tnum { font-variant-numeric: tabular-nums; }
.serif { font-family: var(--serif); }
.up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); }
.info { color: var(--info); } .ink2 { color: var(--ink-2); } .ink3 { color: var(--ink-3); } .ink4 { color: var(--ink-4); }
.eyebrow { font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: var(--ink-3); }
.divider-h { height: 1px; background: var(--rule); width: 100%; }
.divider-v { width: 1px; background: var(--rule); align-self: stretch; }
.app {
  display: grid; grid-template-rows: 56px 1fr; grid-template-columns: 60px 1fr;
  height: 100vh; background: var(--bg); gap: 0;
}
.topbar {
  grid-column: 1 / -1; display: flex; align-items: center;
  padding: 0 20px; border-bottom: 1px solid var(--rule);
  background: var(--bg-1); gap: 22px; font-size: var(--fs-sm);
}
.topbar .brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-weight: 500; font-size: 17px; letter-spacing: 0.01em; font-style: italic; }
.topbar .brand .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); }
.topbar .crumbs { font-family: var(--sans); font-size: 12px; color: var(--ink-3); letter-spacing: 0.02em; text-transform: capitalize; }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 16px; font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
.topbar .right .fx { display: flex; gap: 14px; }
.topbar .right .fx .pair { color: var(--ink-3); }
.topbar .right .fx .val { color: var(--ink); }
.theme-toggle { font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--ink-3); padding: 6px 10px; border: 1px solid var(--rule); border-radius: 3px; }
.theme-toggle:hover { color: var(--ink); border-color: var(--rule-2); }
.sidebar { background: var(--bg-1); border-right: 1px solid var(--rule); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; }
.nav-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-3); position: relative; transition: color 0.12s, background 0.12s; }
.nav-btn:hover { color: var(--ink); background: var(--panel); }
.nav-btn.active { color: var(--accent); background: var(--panel); }
.nav-btn.active::before { content: ''; position: absolute; left: -1px; top: 10px; bottom: 10px; width: 2px; background: var(--accent); border-radius: 0 2px 2px 0; }
.nav-btn svg { width: 19px; height: 19px; }
.nav-btn .tip { position: absolute; left: 52px; background: var(--panel-hi); color: var(--ink); padding: 5px 10px; font-size: 11px; font-family: var(--sans); border: 1px solid var(--rule-2); border-radius: 3px; opacity: 0; pointer-events: none; white-space: nowrap; transform: translateX(-4px); transition: opacity 0.12s, transform 0.12s; z-index: 10; }
.nav-btn:hover .tip { opacity: 1; transform: translateX(0); }
.main { overflow: auto; background: var(--bg); }
.panel { background: var(--panel); border: 1px solid var(--rule); }
.panel-h { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--rule); background: var(--panel-2); min-height: 38px; gap: 12px; }
.panel-h .title { font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: 0.01em; color: var(--ink-2); }
.panel-h .meta { font-family: var(--sans); font-size: 11px; color: var(--ink-4); margin-left: auto; letter-spacing: 0; }
.panel-h .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.panel-b { padding: var(--pad); }
.panel-b.flush { padding: 0; }
.screen { display: grid; gap: var(--gap); background: var(--rule); min-height: 100%; }
table.ledger { font-family: var(--sans); font-size: var(--fs-sm); }
table.ledger th { text-align: left; font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-3); padding: 10px 14px; border-bottom: 1px solid var(--rule); background: var(--panel-2); position: sticky; top: 0; }
table.ledger th.r { text-align: right; }
table.ledger td { padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
table.ledger td.r { text-align: right; }
table.ledger tr:hover td { background: var(--panel-2); }
table.ledger tr.group-h td { background: var(--bg-1); color: var(--ink-3); font-size: 11px; font-weight: 500; letter-spacing: 0.01em; padding: 8px 14px; border-top: 1px solid var(--rule-2); }
.cat-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); font-family: var(--sans); white-space: nowrap; }
.cat-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.cat-an_uong   { background: #7AB888; }
.cat-must_have { background: #6AAABB; }
.cat-optional  { background: #D07090; }
.cat-khac      { background: #D4A060; }
.cat-me        { background: #A85070; }

.btn { font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: 0.01em; padding: 6px 12px; border: 1px solid var(--rule-2); color: var(--ink-2); background: transparent; border-radius: 3px; transition: all 0.12s; }

.btn.primary { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: var(--bg); }
.btn.ghost { border-color: transparent; }
.btn.ghost:hover { background: var(--panel-hi); }
.field { background: var(--bg); border: 1px solid var(--rule-2); padding: 7px 11px; font-family: var(--sans); font-size: var(--fs-sm); color: var(--ink); border-radius: 3px; height: 32px; }
.field:focus { outline: none; border-color: var(--accent); }

.field-lbl { font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--ink-3); margin-bottom: 5px; display: block; }

.kpi .val.mono { font-family: var(--mono); font-size: 30px; font-weight: 500; }
.kpi .val .ccy { font-size: 0.5em; color: var(--ink-3); margin-right: 4px; font-family: var(--sans); font-weight: 400; }
.kpi .sub { font-family: var(--sans); font-size: 11px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.delta { display: inline-flex; gap: 3px; align-items: center; font-family: var(--sans); font-size: 11px; }
.delta .arr { font-size: 9px; }
.bar { background: var(--bg); height: 5px; position: relative; border-radius: 3px; overflow: hidden; }
.bar-fill { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); border-radius: 3px; }
.bar.tall { height: 10px; border-radius: 5px; }
.bar.tall .bar-fill { border-radius: 5px; }
.bar.thin { height: 3px; background: var(--rule-2); }
.chat-msg { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.chat-msg .who { font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--ink-3); width: 56px; flex-shrink: 0; padding-top: 4px; }
.chat-msg.advisor .who { color: var(--accent); }
.chat-msg .body { font-size: var(--fs-md); line-height: 1.6; color: var(--ink); }

.chat-msg .body p:last-child { margin: 0; }
.chat-msg .body .num { font-family: var(--mono); color: var(--accent); }
.chat-msg.advisor .body { font-family: var(--serif); font-size: 15px; line-height: 1.65; }

.flex { display: flex; } .flex-col { display: flex; flex-direction: column; }
.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-6 { gap: 24px; }

.badge.down { color: var(--down); border-color: color-mix(in oklab,var(--down) 40%,var(--rule)); }
.badge.warn { color: var(--warn); border-color: color-mix(in oklab,var(--warn) 40%,var(--rule)); }
.badge.info { color: var(--info); border-color: color-mix(in oklab,var(--info) 40%,var(--rule)); }

.dots::after { content: '...'; display: inline-block; animation: dots 1.2s steps(4,end) infinite; letter-spacing: 0.15em; }
@keyframes dots { 0%,20%{content:''} 40%{content:'.'} 60%{content:'..'} 80%,100%{content:'...'} }
</style>

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd"><b>{title}</b><button className="twk-x" onClick={dismiss}>✕</button></div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakRow({ label, value, children, inline=false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl"><span>{label}</span>{value!=null&&<span className="twk-val">{value}</span>}</div>
      {children}
    </div>
  );
}
function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={e=>onChange(e.target.value)}>
        {options.map(o=>{const v=typeof o==='object'?o.value:o;const l=typeof o==='object'?o.label:o;return <option key={v} value={v}>{l}</option>;})}
      </select>
    </TweakRow>
  );
}
function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const opts = options.map(o=>typeof o==='object'?o:{value:o,label:o});
  const idx = Math.max(0,opts.findIndex(o=>o.value===value));
  const n = opts.length;
  const maxLen = opts.reduce((m,o)=>Math.max(m,String(o.label).length),0);
  const fitsAsSegments = maxLen <= ({2:16,3:10}[n]??0);
  if (!fitsAsSegments) return <TweakSelect label={label} value={value} options={options} onChange={v=>onChange(opts.find(o=>String(o.value)===v)?.value??v)} />;
  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" className="twk-seg"
        onPointerDown={e=>{
          const r=trackRef.current.getBoundingClientRect();
          const i=Math.floor(((e.clientX-r.left-2)/(r.width-4))*n);
          const v=opts[Math.max(0,Math.min(n-1,i))].value;
          onChange(v);
        }}>
        <div className="twk-seg-thumb" style={{left:`calc(2px + ${idx} * (100% - 4px) / ${n})`,width:`calc((100% - 4px) / ${n})`}}/>
        {opts.map(o=><button key={o.value} type="button" role="radio" aria-checked={o.value===value}>{o.label}</button>)}
      </div>
    </TweakRow>
  );
}
function TweakColor({ label, value, options, onChange }) {
  if (!options?.length) return (
    <div className="twk-row twk-row-h"><div className="twk-lbl"><span>{label}</span></div>
      <input type="color" style={{width:56,height:22,border:'.5px solid rgba(0,0,0,.1)',borderRadius:6,padding:0,cursor:'default',background:'transparent'}} value={value} onChange={e=>onChange(e.target.value)}/>
    </div>
  );
  const cur = String(JSON.stringify(value)).toLowerCase();
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o,i)=>{
          const colors=Array.isArray(o)?o:[o];
          const [hero,...rest]=colors;
          const on=String(JSON.stringify(o)).toLowerCase()===cur;
          return (
            <button key={i} type="button" className="twk-chip" data-on={on?'1':'0'}
              style={{background:hero}} onClick={()=>onChange(o)}>
              {on&&<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" stroke={hero<'#888888'?'#fff':'rgba(0,0,0,.78)'}/></svg>}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakSelect, TweakRadio, TweakColor });
</script>

<script type="text/babel">
/* ===== OVERVIEW SCREEN ===== */
(() => {
const { useMemo } = React;
const D = window.MERIDIAN_DATA;

function CashflowChart({ data }) {
  const W=760,H=200,padL=52,padR=16,padT=16,padB=30;
  const iW=W-padL-padR,iH=H-padT-padB;
  const maxVal=Math.max(...data.map(d=>Math.max(d.income_eur,d.expense)))*1.12;
  const n=data.length,xStep=iW/(n-1);
  const fy=v=>padT+iH-(v/maxVal)*iH,fx=i=>padL+i*xStep;
  const incPath=data.map((d,i)=>`${i===0?'M':'L'} ${fx(i)} ${fy(d.income_eur)}`).join(' ');
  const expPath=data.map((d,i)=>`${i===0?'M':'L'} ${fx(i)} ${fy(d.expense)}`).join(' ');
  const yTicks=[0,maxVal*.25,maxVal*.5,maxVal*.75,maxVal];
  return (
    <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`}>
      {yTicks.map((t,i)=>(
        <g key={i}>
          <line x1={padL} y1={fy(t)} x2={W-padR} y2={fy(t)} stroke="var(--rule)" strokeDasharray="2 4"/>
          <text x={padL-6} y={fy(t)+4} fontSize="10" fill="var(--ink-4)" textAnchor="end" fontFamily="var(--sans)">€{t>=1000?(t/1000).toFixed(1)+'k':t.toFixed(0)}</text>
        </g>
      ))}
      <path d={expPath} stroke="var(--down)" strokeWidth="1.75" fill="none"/>
      <path d={incPath} stroke="var(--up)" strokeWidth="1.75" fill="none"/>
      {data.map((d,i)=>(
        <g key={i}>
          {d.income_eur>0&&<circle cx={fx(i)} cy={fy(d.income_eur)} r="3" fill="var(--up)"/>}
          <circle cx={fx(i)} cy={fy(d.expense)} r="3" fill="var(--down)"/>
          <text x={fx(i)} y={H-8} fontSize="10" fill="var(--ink-4)" textAnchor="middle" fontFamily="var(--sans)">
            {new Date(d.m+'-01').toLocaleDateString('en-GB',{month:'short'})}

        </g>
      ))}
      <text x={fx(n-1)} y={fy(0)-6} fontSize="9" fill="var(--ink-3)" textAnchor="end" fontFamily="var(--sans)" fontStyle="italic">pending</text>

}

function DebtArc() {
  const remitted=D.LOAN_SCHEDULE.filter(s=>s.status==='remitted').reduce((s,x)=>s+x.amount,0);
  const accrued=D.LOAN_SCHEDULE.filter(s=>s.status==='accrued').reduce((s,x)=>s+x.amount,0);
  const pctR=remitted/D.LOAN_TOTAL_VND,pctA=(remitted+accrued)/D.LOAN_TOTAL_VND;
  const r=60,c=2*Math.PI*r;
  return (
    <div style={{display:'flex',gap:18,alignItems:'center'}}>
      <svg width="148" height="148" viewBox="-74 -74 148 148">
        <circle r={r} fill="none" stroke="var(--rule-2)" strokeWidth="7"/>
        <circle r={r} fill="none" stroke="var(--accent)" strokeWidth="7" opacity="0.35" strokeDasharray={`${c*pctA} ${c}`} transform="rotate(-90)"/>
        <circle r={r} fill="none" stroke="var(--accent)" strokeWidth="7" strokeDasharray={`${c*pctR} ${c}`} transform="rotate(-90)"/>
        <text textAnchor="middle" dy="-4" fontFamily="var(--serif)" fontSize="24" fill="var(--ink)">{(pctA*100).toFixed(0)}%</text>
        <text textAnchor="middle" dy="16" fontFamily="var(--sans)" fontSize="9" fill="var(--ink-3)">covered</text>
      </svg>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <div>
          <div className="eyebrow" style={{display:'flex',alignItems:'center',gap:5}}><span style={{color:'var(--accent)'}}>●</span> Sent to mom</div>

        <div>
          <div className="eyebrow" style={{display:'flex',alignItems:'center',gap:5}}><span style={{color:'var(--accent)',opacity:.45}}>●</span> Set aside</div>

        </div>
      </div>
    </div>
  );
}

function CategoryBars({ allEntries }) {
  const entries = allEntries || D.ENTRIES;
  const now = new Date();
  const curMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const sums={};
  entries.filter(e=>e.date.startsWith(curMonth)).forEach(e=>{sums[e.cat]=(sums[e.cat]||0)+D.toEUR(e.amount,e.ccy);});
  const total=Object.values(sums).reduce((a,b)=>a+b,0);
  const cats=[{id:'an_uong',color:'#6FB983'},{id:'must_have',color:'#5891D9'},{id:'optional',color:'#C284E8'},{id:'khac',color:'#E8A33D'}];
  return (
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      {cats.map(({id,color})=>{
        const cat=D.catById(id),v=sums[id]||0,pct=total?(v/total)*100:0;
        return (
          <div key={id} style={{display:'flex',flexDirection:'column',gap:5}}>
            <div className="row-between">
              <div className="cat-chip"><span className="cat-dot" style={{background:color}}></span>{cat.en}</div>
              <div style={{fontSize:12}}><span style={{color:'var(--ink)'}}>€{v.toFixed(0)}</span><span className="ink3" style={{marginLeft:8}}>{pct.toFixed(0)}%</span></div>
            </div>
            <div className="bar thin"><div className="bar-fill" style={{width:`${pct}%`,background:color}}></div></div>
          </div>
        );
      })}

}

function RecentActivity({ allEntries }) {
  const recent=[...(allEntries||D.ENTRIES)].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  return (
    <table className="ledger">
      <thead><tr><th style={{width:90}}>Date</th><th>Item</th><th>Category</th><th className="r">Amount</th></tr></thead>
      <tbody>
        {recent.map(e=>{const cat=D.catById(e.cat);return(
          <tr key={e.id}>
            <td className="ink3">{e.date.slice(5)}</td>
            <td style={{color:'var(--ink)'}}>{e.label}</td>
            <td><span className="cat-chip"><span className={`cat-dot ${cat.cls}`}></span>{cat.en}</span></td>
            <td className="r mono">{D.fmt(e.amount,e.ccy)}</td>
          </tr>
        );})}
      </tbody>
    </table>
  );
}

function AccountsList() {
  const total=D.ACCOUNTS.reduce((s,a)=>s+D.toEUR(a.balance,a.ccy),0);
  return (
    <div style={{display:'flex',flexDirection:'column'}}>
      {D.ACCOUNTS.map(a=>(
        <div key={a.id} style={{padding:'14px 16px',borderBottom:'1px solid var(--rule)'}}>
          <div className="row-between">
            <div><div style={{fontSize:13,fontWeight:500,color:'var(--ink)'}}>{a.name}</div><div className="ink4" style={{fontSize:11}}>{a.bank} · {a.ccy}</div></div>
            <div style={{textAlign:'right'}}>
              <div className="serif" style={{fontSize:19,color:'var(--ink)'}}>{D.fmt(a.balance,a.ccy)}</div>
              {a.ccy!=='EUR'&&<div className="ink3" style={{fontSize:11}}>≈ {D.fmt(D.toEUR(a.balance,a.ccy),'EUR',{decimals:0})}</div>}
            </div>
          </div>
          {a.note&&<div className="serif ink3" style={{fontSize:12,fontStyle:'italic',marginTop:6,lineHeight:1.4}}>{a.note}</div>}
        </div>
      ))}
      <div style={{padding:'14px 16px',background:'var(--panel-2)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span className="eyebrow">Total (EUR equiv.)</span>
        <span className="serif" style={{fontSize:22}}>€{total.toLocaleString('en-US',{maximumFractionDigits:0})}</span>
      </div>
    </div>
  );
}

function KPI({label,value,serif,sub,delta,deltaDir,note}) {
  return (
    <div className="kpi">
      <div className="lbl">{label}</div>
      <div className={serif?'val':'val mono'}>{value}</div>
      <div className="sub">
        {delta&&<span className={`delta ${deltaDir||''}`}><span className="arr">{deltaDir==='up'?'▲':deltaDir==='down'?'▼':'◆'}</span>{delta}</span>}
        {sub&&<span>{sub}</span>}
      </div>
      {note&&<div style={{fontSize:11,color:'var(--ink-4)',fontStyle:'italic',marginTop:3}}>{note}</div>}
    </div>
  );
}

function NetWorthChart({data}) {
  const W=900,H=140,padL=60,padR=16,padT=14,padB=24;
  const iW=W-padL-padR,iH=H-padT-padB;
  const vals=data.map(d=>d.val);
  const min=Math.min(...vals),max=Math.max(...vals,0),range=max-min||1;
  const xStep=iW/(data.length-1);
  const fy=v=>padT+iH-((v-min)/range)*iH,fx=i=>padL+i*xStep;
  const zeroY=fy(0),path=data.map((d,i)=>`${i===0?'M':'L'} ${fx(i)} ${fy(d.val)}`).join(' ');
  const area=path+` L ${fx(data.length-1)} ${padT+iH} L ${padL} ${padT+iH} Z`;
  return (
    <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`}>
      {zeroY>padT&&zeroY<padT+iH&&<><line x1={padL} y1={zeroY} x2={W-padR} y2={zeroY} stroke="var(--rule-2)" strokeDasharray="3 3"/><text x={padL-6} y={zeroY+4} fontSize="10" fill="var(--ink-3)" textAnchor="end" fontFamily="var(--sans)">€0</text></>}
      <text x={padL-6} y={fy(min)+4} fontSize="10" fill="var(--ink-4)" textAnchor="end" fontFamily="var(--sans)">−€{Math.round(Math.abs(min)/1000)}k</text>

      {data.map((d,i)=>(

          <circle cx={fx(i)} cy={fy(d.val)} r="2.5" fill="var(--accent)"/>

        </g>
      ))}
    </svg>
  );
}

function OverviewScreen({ allEntries, monthlyInputs }) {
  const now = new Date();
  const curMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const curMonthLabel = now.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const entries = allEntries || D.ENTRIES;
  const inputs = monthlyInputs || D.MONTHLY_INPUTS.map(m=>({...m}));

  // Live expense from entries for current month
  const curMonthExpense = entries.filter(e=>e.date.startsWith(curMonth)&&e.cat!=='income').reduce((s,e)=>s+D.toEUR(e.amount,e.ccy),0);

  // Live salary from monthlyInputs
  const curInput = inputs.find(m=>m.month===curMonth);
  const salaryUSD = curInput?.income_usd||0;
  const salaryEUR = curInput?.income_eur||0;

  // Live mom set-aside from monthlyInputs (all unremitted months)
  const liveAccrued = inputs.reduce((s,m)=>{
    const sched = D.LOAN_SCHEDULE.find(x=>x.month===m.month);
    if (m.mom_set_aside>0 && sched && (sched.status==='accrued'||sched.status==='scheduled')) return s+m.mom_set_aside;
    return s;
  },0);
  const fallbackAccrued = D.LOAN_SCHEDULE.filter(s=>s.status==='accrued').reduce((s,x)=>s+x.amount,0);
  const accrued = liveAccrued>0?liveAccrued:fallbackAccrued;

  const restingEUR=D.ACCOUNTS.reduce((s,a)=>s+D.toEUR(a.balance,a.ccy),0);
  const freeCash=restingEUR-D.toEUR(accrued,'VND');
  const nwDelta=D.NET_WORTH.net-D.NET_WORTH.history[0].val;
  return (
    <div className="screen" style={{gridTemplateColumns:'1fr',gridAutoRows:'auto'}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:1,background:'var(--rule)'}}>
        <div style={{background:'var(--panel)'}}><KPI label="Cash · all accounts" serif value={`€${restingEUR.toLocaleString('en-US',{maximumFractionDigits:0})}`} sub="BNP + Revolut combined"/></div>
        <div style={{background:'var(--panel)'}}><KPI label="Free cash (after mom set-aside)" serif value={`€${freeCash.toLocaleString('en-US',{maximumFractionDigits:0})}`} delta={`${D.fmt(accrued,'VND',{compact:true})} earmarked for mom`} deltaDir="flat"/></div>
        <div style={{background:'var(--panel)'}}><KPI label={`${curMonthLabel} expenses to date`} serif value={`€${curMonthExpense.toFixed(0)}`} sub={salaryUSD>0?`salary received · €${salaryEUR.toLocaleString()}`:'salary not yet received'}/></div>
        <div style={{background:'var(--panel)'}}><KPI label="Monthly salary (USD)" serif value={salaryUSD>0?`$${salaryUSD.toLocaleString()}`:'Pending'} sub={salaryUSD>0?`≈ €${salaryEUR.toLocaleString()} this month`:'Expected end of month'} note={salaryUSD===0?'Log salary in Ledger when received':undefined}/></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1.6fr 1fr 1.3fr',gap:1,background:'var(--rule)'}}>
        <div className="panel" style={{borderTop:0,borderLeft:0,borderBottom:0}}>
          <div className="panel-h"><span className="title">Cashflow · Nov '25 – May '26</span><span className="badge up">● Income (EUR equiv.)</span><span className="badge down">● Expense</span></div>
          <div className="panel-b"><CashflowChart data={D.HISTORY}/></div>
        </div>
        <div className="panel" style={{borderTop:0,borderBottom:0}}>
          <div className="panel-h"><span className="title">Debt to mom · progress</span><span className="meta">1.5B ₫ total</span></div>
          <div className="panel-b" style={{display:'flex',justifyContent:'center',padding:18}}><DebtArc/></div>
        </div>
        <div className="panel" style={{borderTop:0,borderBottom:0,borderRight:0}}>
          <div className="panel-h"><span className="title">Today's briefing</span><span className="meta">{D.BRIEFING.date}</span></div>
          <div className="panel-b" style={{display:'flex',flexDirection:'column',gap:12}}>
            <div className="serif" style={{fontSize:18,lineHeight:1.3,color:'var(--ink)',fontStyle:'italic'}}>{D.BRIEFING.title}</div>
            <div className="serif" style={{fontSize:13,lineHeight:1.65,color:'var(--ink-2)'}}>{D.BRIEFING.body[0]}</div>
            <div style={{marginTop:'auto'}}><button className="btn">Open advisor →</button></div>
          </div>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1.1fr 1.6fr',gap:1,background:'var(--rule)'}}>
        <div className="panel" style={{borderBottom:0,borderLeft:0}}>
          <div className="panel-h"><span className="title">{curMonthLabel} spending · by category</span><span className="meta">€{curMonthExpense.toFixed(0)}</span></div>
          <div className="panel-b"><CategoryBars allEntries={entries}/></div>
        </div>
        <div className="panel" style={{borderBottom:0}}>
          <div className="panel-h"><span className="title">Accounts</span></div>
          <div className="panel-b flush"><AccountsList/></div>
        </div>
        <div className="panel" style={{borderBottom:0,borderRight:0}}>
          <div className="panel-h"><span className="title">Recent activity</span><div className="actions"><button className="btn">+ Log</button></div></div>
          <div className="panel-b flush"><RecentActivity allEntries={entries}/></div>
        </div>
      </div>
      <div className="panel" style={{border:0}}>
        <div className="panel-h">
          <span className="title">Net worth trajectory · Nov '25 — May '26</span>
          <span className="badge up">+€{Math.round(nwDelta/1000)}k improvement since Nov '25</span>
          <span className="meta">Still negative · turns positive after debt-free (Jun '27)</span>
        </div>
        <div className="panel-b" style={{display:'flex',gap:24,alignItems:'center'}}>
          <div style={{flex:1}}><NetWorthChart data={D.NET_WORTH.history}/></div>
          <div style={{width:240,display:'flex',flexDirection:'column',gap:12}}>
            <div><div className="eyebrow">Assets</div><div className="serif" style={{fontSize:22,color:'var(--up)'}}>{D.fmt(D.NET_WORTH.assets,'EUR',{decimals:0})}</div></div>
            <div><div className="eyebrow">Liabilities (debt remaining)</div><div className="serif" style={{fontSize:22,color:'var(--down)'}}>{D.fmt(D.NET_WORTH.liabilities,'EUR',{decimals:0})}</div></div>
            <div style={{borderTop:'1px solid var(--rule)',paddingTop:12}}>
              <div className="eyebrow">Net</div>
              <div className="serif" style={{fontSize:26,color:'var(--ink)'}}>{D.fmt(D.NET_WORTH.net,'EUR',{decimals:0,sign:true})}</div>
              <div className="ink3" style={{fontSize:11,marginTop:4}}>Improving ~€{Math.round(Math.abs(nwDelta)/7)}k/month</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

window.OverviewScreen = OverviewScreen;
})();
</script>

<script type="text/babel">
/* ===== LEDGER SCREEN ===== */
(() => {
const { useMemo, useState } = React;
const D = window.MERIDIAN_DATA;

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function buildMonths() {
  const now = new Date();
  const cur = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const base = [
    { value:'2026-05', label:'May 2026' },
    { value:'2026-04', label:'Apr 2026' },
    { value:'2026-03', label:'Mar 2026' },
    { value:'2026-02', label:'Feb 2026' },
    { value:'2026-01', label:'Jan 2026' },
    { value:'2025-12', label:'Dec 2025' },
    { value:'2025-11', label:'Nov 2025' },
  ];
  if (!base.find(m=>m.value===cur)) {
    base.unshift({ value:cur, label:`${MONTH_NAMES[now.getMonth()]} ${now.getFullYear()}` });
  }
  return base;
}
const MONTHS = buildMonths();

function MonthlyInputs({ selectedMonth, monthlyInputs, updateMonthlyInput }) {
  const input = monthlyInputs.find(m=>m.month===selectedMonth)||null;
  const history = monthlyInputs.slice().reverse();
  const [showSalary, setShowSalary] = React.useState(false);
  const [showMom, setShowMom] = React.useState(false);
  const [salaryVal, setSalaryVal] = React.useState('');
  const [momVal, setMomVal] = React.useState('');

  function submitSalary() {
    const v = parseFloat(salaryVal);
    if (!v || v <= 0) return;
    updateMonthlyInput(selectedMonth, 'income_usd', v);
    updateMonthlyInput(selectedMonth, 'income_eur', parseFloat((v / D.FX.EURUSD).toFixed(0)));
    setSalaryVal(''); setShowSalary(false);
  }
  function submitMom() {
    const v = parseFloat(momVal);
    if (!v || v <= 0) return;
    updateMonthlyInput(selectedMonth, 'mom_set_aside', v * 1_000_000);
    setMomVal(''); setShowMom(false);
  }

  return (
    <div>
      <div style={{padding:'18px 20px',borderBottom:'1px solid var(--rule)'}}>
        <div className="eyebrow" style={{marginBottom:14}}>{MONTHS.find(m=>m.value===selectedMonth)?.label||selectedMonth}</div>
        {input ? (
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
            <div>
              <div className="row-between" style={{marginBottom:4}}>
                <span style={{fontSize:12,color:'var(--ink-2)'}}>Salary received</span>
                {input.income_usd>0?<span className="badge up">Received</span>:<span className="badge warn">Pending</span>}
              </div>
              <div className="serif" style={{fontSize:26,color:input.income_usd>0?'var(--ink)':'var(--ink-4)',lineHeight:1.1}}>
                {input.income_usd>0?`$${input.income_usd.toLocaleString()}`:'Not received'}
              </div>
              {input.income_usd>0&&<div className="ink3" style={{fontSize:11,marginTop:3}}>≈ €{input.income_eur.toLocaleString()} at month rate</div>}
              {input.income_usd===0&&<div className="ink3" style={{fontSize:11,marginTop:3}}>Typical: $3,850 USD · expected end of month</div>}
            </div>
            <div>
              <div className="row-between" style={{marginBottom:4}}>
                <span style={{fontSize:12,color:'var(--ink-2)'}}>Set aside for mom</span>
                {input.mom_set_aside>0?<span className="badge" style={{color:'var(--accent)',borderColor:'color-mix(in oklab,var(--accent) 40%,var(--rule))'}}>Allocated</span>:<span className="badge warn">Pending</span>}
              </div>
              <div className="serif" style={{fontSize:26,color:input.mom_set_aside>0?'var(--accent)':'var(--ink-4)',lineHeight:1.1}}>
                {input.mom_set_aside>0?`${(input.mom_set_aside/1_000_000).toFixed(0)}M ₫`:'Not yet'}
              </div>
              {input.mom_set_aside>0&&<div className="ink3" style={{fontSize:11,marginTop:3}}>≈ €{D.toEUR(input.mom_set_aside,'VND').toFixed(0)} at current rate</div>}
              {input.mom_set_aside===0&&<div className="ink3" style={{fontSize:11,marginTop:3}}>Plan: 70M ₫ (≈ €{D.toEUR(70_000_000,'VND').toFixed(0)})</div>}
            </div>
          </div>
        ) : (
          <div className="serif ink3" style={{fontStyle:'italic',fontSize:14}}>No data recorded for this month yet.</div>
        )}
      </div>
      <div style={{padding:'14px 20px'}}>
        <div className="eyebrow" style={{marginBottom:10}}>History</div>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr>
            <th style={{textAlign:'left',fontSize:10,color:'var(--ink-4)',fontWeight:500,padding:'4px 0',letterSpacing:'0.03em'}}>MONTH</th>
            <th style={{textAlign:'right',fontSize:10,color:'var(--ink-4)',fontWeight:500,padding:'4px 0',letterSpacing:'0.03em'}}>SALARY (USD)</th>
            <th style={{textAlign:'right',fontSize:10,color:'var(--ink-4)',fontWeight:500,padding:'4px 0',letterSpacing:'0.03em'}}>TO MOM</th>
          </tr></thead>
          <tbody>
            {history.map(m=>(
              <tr key={m.month} style={{background:m.month===selectedMonth?'var(--panel-hi)':'transparent'}}>
                <td style={{padding:'7px 0',fontSize:12,color:'var(--ink-2)'}}>{new Date(m.month+'-01').toLocaleDateString('en-GB',{month:'short',year:'numeric'})}</td>
                <td style={{padding:'7px 0',fontSize:12,textAlign:'right',color:m.income_usd>0?'var(--ink)':'var(--ink-4)',fontFamily:'var(--mono)'}}>{m.income_usd>0?`$${m.income_usd.toLocaleString()}`:'—'}</td>
                <td style={{padding:'7px 0',fontSize:12,textAlign:'right',color:m.mom_set_aside>0?'var(--accent)':'var(--ink-4)',fontFamily:'var(--mono)'}}>{m.mom_set_aside>0?`${(m.mom_set_aside/1_000_000).toFixed(0)}M ₫`:'—'}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {showSalary&&(
        <div style={{padding:'12px 20px',background:'var(--bg-1)',borderTop:'1px solid var(--rule)',display:'flex',flexDirection:'column',gap:8}}>
          <div className="eyebrow">Log salary · {MONTHS.find(m=>m.value===selectedMonth)?.label}</div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <span style={{fontSize:13,color:'var(--ink-3)',fontFamily:'var(--mono)'}}>$</span>
            <input className="field" type="number" step="1" min="0" placeholder="3850" value={salaryVal} onChange={e=>setSalaryVal(e.target.value)} style={{flex:1}} autoFocus onKeyDown={e=>e.key==='Enter'&&submitSalary()}/>
            <button className="btn primary" onClick={submitSalary}>Save</button>
            <button className="btn" onClick={()=>{setShowSalary(false);setSalaryVal('');}}>✕</button>
          </div>
          {salaryVal&&parseFloat(salaryVal)>0&&<div className="ink3" style={{fontSize:11}}>≈ €{(parseFloat(salaryVal)/D.FX.EURUSD).toFixed(0)} at current EUR/USD {D.FX.EURUSD}</div>}
        </div>
      )}
      {showMom&&(
        <div style={{padding:'12px 20px',background:'var(--bg-1)',borderTop:'1px solid var(--rule)',display:'flex',flexDirection:'column',gap:8}}>
          <div className="eyebrow">Set aside for mom · {MONTHS.find(m=>m.value===selectedMonth)?.label}</div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <input className="field" type="number" step="1" min="0" placeholder="70" value={momVal} onChange={e=>setMomVal(e.target.value)} style={{flex:1}} autoFocus onKeyDown={e=>e.key==='Enter'&&submitMom()}/>
            <span style={{fontSize:12,color:'var(--ink-3)',fontFamily:'var(--mono)',whiteSpace:'nowrap'}}>M ₫</span>
            <button className="btn primary" onClick={submitMom}>Save</button>
            <button className="btn" onClick={()=>{setShowMom(false);setMomVal('');}}>✕</button>
          </div>
          {momVal&&parseFloat(momVal)>0&&<div className="ink3" style={{fontSize:11}}>≈ €{D.toEUR(parseFloat(momVal)*1_000_000,'VND').toFixed(0)} at current EUR/VND rate</div>}
        </div>
      )}
      <div style={{padding:'12px 20px',background:'var(--panel-2)',borderTop:'1px solid var(--rule)',display:'flex',gap:8}}>
        <button className="btn" style={{flex:1,background:showSalary?'var(--panel-hi)':undefined}} onClick={()=>{setShowMom(false);setShowSalary(s=>!s);setSalaryVal('');}}>+ Log salary</button>
        <button className="btn primary" style={{flex:1}} onClick={()=>{setShowSalary(false);setShowMom(s=>!s);setMomVal('');}}>+ Set aside for mom</button>
      </div>
    </div>
  );
}

function QuickAddExpense({ onAdd, selectedMonth }) {
  const [cat,setCat]=useState('an_uong'),[label,setLabel]=useState(''),[amount,setAmount]=useState(''),[ccy,setCcy]=useState('EUR'),[date,setDate]=useState(selectedMonth+'-27');
  function submit(e){e.preventDefault();if(!label.trim()||!amount)return;onAdd({id:'n'+Date.now(),date,cat,label:label.trim(),amount:parseFloat(amount),ccy});setLabel('');setAmount('');}
  return (
    <form onSubmit={submit} style={{display:'flex',gap:10,alignItems:'flex-end',padding:'12px 16px',borderBottom:'1px solid var(--rule)',background:'var(--panel-2)'}}>
      <div style={{display:'flex',flexDirection:'column'}}>
        <label className="field-lbl">Date</label>
        <input className="field" type="date" value={date} onChange={e=>setDate(e.target.value)} style={{width:140}}/>
      </div>
      <div style={{display:'flex',flexDirection:'column'}}>
        <label className="field-lbl">Category</label>
        <select className="field" value={cat} onChange={e=>setCat(e.target.value)} style={{width:160}}>
          {D.CATEGORIES.filter(c=>c.id!=='income'&&c.id!=='me').map(c=><option key={c.id} value={c.id}>{c.en}</option>)}
        </select>
      </div>
      <div style={{display:'flex',flexDirection:'column',flex:1}}>
        <label className="field-lbl">Item description</label>
        <input className="field" placeholder="e.g. sieu thi, MRT, cafe" value={label} onChange={e=>setLabel(e.target.value)}/>
      </div>
      <div style={{display:'flex',flexDirection:'column'}}>
        <label className="field-lbl">Amount</label>
        <input className="field" placeholder="0.00" type="number" step="0.01" value={amount} onChange={e=>setAmount(e.target.value)} style={{width:100,textAlign:'right'}}/>
      </div>
      <div style={{display:'flex',flexDirection:'column'}}>
        <label className="field-lbl">Currency</label>
        <select className="field" value={ccy} onChange={e=>setCcy(e.target.value)} style={{width:80}}>
          <option>EUR</option><option>USD</option><option>VND</option>
        </select>
      </div>
      <button type="submit" className="btn primary" style={{height:32,whiteSpace:'nowrap'}}>+ Log</button>
    </form>
  );
}

function FilterChips({ activeCats, toggleCat, displayCcy, setDisplayCcy }) {
  const expCats=D.CATEGORIES.filter(c=>c.id!=='income'&&c.id!=='me');
  return (
    <div style={{display:'flex',gap:8,padding:'10px 16px',borderBottom:'1px solid var(--rule)',alignItems:'center',flexWrap:'wrap'}}>
      <span className="eyebrow" style={{marginRight:2}}>Filter</span>
      {expCats.map(c=>{const on=activeCats.includes(c.id);return(
        <button key={c.id} onClick={()=>toggleCat(c.id)} style={{padding:'5px 10px',fontFamily:'var(--sans)',fontSize:11,fontWeight:500,border:'1px solid '+(on?'var(--accent)':'var(--rule-2)'),background:on?'color-mix(in oklab,var(--accent) 14%,transparent)':'transparent',color:on?'var(--accent)':'var(--ink-3)',borderRadius:3,display:'inline-flex',alignItems:'center',gap:5,cursor:'pointer'}}>
          <span className={`cat-dot ${c.cls}`}></span>{c.en}
        </button>
      );})}
      <div style={{marginLeft:'auto',display:'flex',gap:6,alignItems:'center'}}>
        <span className="eyebrow">Show as</span>
        {['EUR','USD','VND'].map(c=>(
          <button key={c} onClick={()=>setDisplayCcy(c)} className="btn" style={{padding:'4px 10px',color:displayCcy===c?'var(--accent)':'var(--ink-3)',borderColor:displayCcy===c?'var(--accent)':'var(--rule-2)'}}>{c}</button>
        ))}
      </div>
    </div>
  );
}

function ExpenseTable({ entries, displayCcy }) {
  if (entries.length===0) return (
    <div style={{padding:'48px 24px',textAlign:'center'}}>
      <div className="serif ink3" style={{fontSize:18,fontStyle:'italic'}}>No expenses logged for this month.</div>
      <div className="ink4" style={{fontSize:12,marginTop:8}}>Use the form above to start logging.</div>
    </div>
  );
  const byDay={};
  entries.forEach(e=>{if(!byDay[e.date])byDay[e.date]=[];byDay[e.date].push(e);});
  const days=Object.keys(byDay).sort().reverse();
  function display(amount,ccy){
    if(displayCcy==='EUR')return D.fmt(D.toEUR(amount,ccy),'EUR');
    if(displayCcy==='USD')return D.fmt(D.toUSD(amount,ccy),'USD');
    return D.fmt(D.toVND(amount,ccy),'VND',{compact:true});
  }
  return (
    <table className="ledger">
      <thead><tr><th style={{width:90}}>Date</th><th>Item</th><th style={{width:160}}>Category</th><th className="r" style={{width:110}}>Original</th><th className="r" style={{width:110}}>{displayCcy}</th></tr></thead>
      <tbody>
        {days.map(day=>{
          const items=byDay[day];
          const dayEUR=items.reduce((s,e)=>s+D.toEUR(e.amount,e.ccy),0);
          return (
            <React.Fragment key={day}>
              <tr className="group-h">
                <td colSpan="3">{new Date(day).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'})}</td>
                <td className="r ink3">{items.length} items</td>
                <td className="r" style={{color:'var(--ink-2)'}}>€{dayEUR.toFixed(2)}</td>
              </tr>
              {items.map(e=>{const cat=D.catById(e.cat);return(
                <tr key={e.id}>
                  <td className="ink3 mono">{e.date.slice(8)}</td>
                  <td style={{color:'var(--ink)'}}>{e.label}</td>
                  <td><span className="cat-chip"><span className={`cat-dot ${cat.cls}`}></span>{cat.en}</span></td>
                  <td className="r mono">{D.fmt(e.amount,e.ccy,{compact:e.ccy==='VND'})}</td>
                  <td className="r mono ink2">{display(e.amount,e.ccy)}</td>
                </tr>
              );})}
            </React.Fragment>
          );
        })}
      </tbody>
    </table>
  );
}

function SpendingCheck({ selectedMonth }) {
  const hist=D.HISTORY.find(h=>h.m===selectedMonth);
  const past=D.HISTORY.filter(h=>h.income_eur>0);
  const avg={expense:past.reduce((s,h)=>s+h.expense,0)/past.length,an_uong:past.reduce((s,h)=>s+h.an_uong,0)/past.length,must_have:past.reduce((s,h)=>s+h.must_have,0)/past.length,optional:past.reduce((s,h)=>s+h.optional,0)/past.length,khac:past.reduce((s,h)=>s+h.khac,0)/past.length};
  const rows=[{lbl:'Food & drink',k:'an_uong'},{lbl:'Essentials',k:'must_have'},{lbl:'Discretionary',k:'optional'},{lbl:'Other',k:'khac'}];
  if(!hist)return <div style={{padding:24}}><div className="serif ink3" style={{fontStyle:'italic',fontSize:14}}>No spending data for this month.</div></div>;
  return (
    <div>
      <div style={{padding:'16px 20px',borderBottom:'1px solid var(--rule)'}}>
        <div className="eyebrow" style={{marginBottom:6}}>vs. {past.length}-month average</div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
          <div className="serif" style={{fontSize:30,color:'var(--ink)'}}>€{hist.expense.toFixed(0)}</div>
          <div className="ink3" style={{fontSize:12}}>avg €{avg.expense.toFixed(0)}/mo</div>
        </div>
        {selectedMonth==='2026-05'&&<div className="ink3 serif" style={{fontSize:12,fontStyle:'italic',marginTop:4}}>Through 25 May only — salary pending</div>}
      </div>
      <div style={{padding:'14px 20px',display:'flex',flexDirection:'column',gap:14}}>
        {rows.map(r=>{const actual=hist[r.k],pct=avg[r.k]>0?(actual/avg[r.k])*100:0,over=pct>100;return(
          <div key={r.k}>
            <div className="row-between" style={{marginBottom:5}}>
              <span style={{fontSize:12,color:'var(--ink-2)'}}>{r.lbl}</span>
              <span style={{fontSize:12}}><span style={{color:over?'var(--down)':'var(--ink)'}}>€{actual.toFixed(0)}</span><span className="ink4"> / avg €{avg[r.k].toFixed(0)}</span></span>
            </div>
            <div className="bar"><div className="bar-fill" style={{width:`${Math.min(pct,100)}%`,background:over?'var(--down)':'var(--accent)'}}></div></div>
            <div className="ink3" style={{fontSize:10,marginTop:3}}>{pct.toFixed(0)}% of average</div>
          </div>
        );})}
      </div>
    </div>
  );
}

function LedgerScreen({ allEntries, onAdd, monthlyInputs, updateMonthlyInput }) {
  const now = new Date();
  const curMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const [selectedMonth,setSelectedMonth]=useState(MONTHS[0]?.value||curMonth);
  const expCats=D.CATEGORIES.filter(c=>c.id!=='income'&&c.id!=='me');
  const [activeCats,setActiveCats]=useState(expCats.map(c=>c.id));
  const [displayCcy,setDisplayCcy]=useState('EUR');
  const [query,setQuery]=useState('');
  function toggleCat(id){setActiveCats(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);}
  // Ensure current month has an entry in monthlyInputs
  const safeInputs = useMemo(()=>{
    if (!monthlyInputs.find(m=>m.month===curMonth)) {
      return [...monthlyInputs, {month:curMonth,income_usd:0,income_eur:0,mom_set_aside:0}];
    }
    return monthlyInputs;
  },[monthlyInputs,curMonth]);

  const filtered=useMemo(()=>allEntries.filter(e=>e.date.startsWith(selectedMonth)&&activeCats.includes(e.cat)&&(!query||e.label.toLowerCase().includes(query.toLowerCase()))),[allEntries,selectedMonth,activeCats,query]);
  const totalEUR=filtered.reduce((s,e)=>s+D.toEUR(e.amount,e.ccy),0);
  const monthLabel=MONTHS.find(m=>m.value===selectedMonth)?.label||selectedMonth;
  return (
    <div className="screen" style={{gridTemplateColumns:'2fr 3fr',gridTemplateRows:'auto 1fr',background:'var(--rule)',height:'100%'}}>
      <div className="panel" style={{borderTop:0,borderLeft:0,borderBottom:0,overflow:'auto'}}>
        <div className="panel-h">
          <span className="title">Monthly inputs</span>
          <select className="field" style={{height:26,fontSize:11,marginLeft:'auto',width:148,flexShrink:0}} value={selectedMonth} onChange={e=>setSelectedMonth(e.target.value)}>
            {MONTHS.map(m=><option key={m.value} value={m.value}>{m.label}</option>)}
          </select>
        </div>
        <MonthlyInputs selectedMonth={selectedMonth} monthlyInputs={safeInputs} updateMonthlyInput={updateMonthlyInput}/>
      </div>
      <div className="panel" style={{borderTop:0,borderRight:0,borderBottom:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div className="panel-h">
          <span className="title">Expenses · {monthLabel}</span>
          <span className="badge info">{filtered.length} entries</span>
          <span className="badge down">€{totalEUR.toFixed(0)}</span>
          <div className="actions">
            <input className="field" placeholder="Search…" value={query} onChange={e=>setQuery(e.target.value)} style={{height:28,width:150,fontSize:12}}/>
            <button className="btn">Export</button>
          </div>
        </div>
        <QuickAddExpense onAdd={onAdd} selectedMonth={selectedMonth}/>
        <FilterChips activeCats={activeCats} toggleCat={toggleCat} displayCcy={displayCcy} setDisplayCcy={setDisplayCcy}/>
        <div style={{overflow:'auto',flex:1}}><ExpenseTable entries={filtered} displayCcy={displayCcy}/></div>
      </div>
      <div className="panel" style={{borderLeft:0,borderBottom:0,overflow:'auto'}}>
        <div className="panel-h"><span className="title">Spending check · {monthLabel}</span></div>
        <SpendingCheck selectedMonth={selectedMonth}/>
      </div>
    </div>
  );
}

window.LedgerScreen = LedgerScreen;
})();
</script>

<script type="text/babel">
/* ===== DEBT SCREEN ===== */
(() => {
const { useState } = React;
const D = window.MERIDIAN_DATA;

const STATUS_COLOR = { remitted:'var(--accent)', accrued:'color-mix(in oklab,var(--accent) 45%,var(--bg-1))', scheduled:'var(--rule-2)', projected:'var(--rule)' };
const STATUS_LABEL = { remitted:'Sent to mom', accrued:'Set aside', scheduled:'Scheduled', projected:'Projected' };

function PaymentTimeline() {
  const maxA=Math.max(...D.LOAN_SCHEDULE.map(s=>s.amount));
  return (
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      <div style={{display:'flex',alignItems:'flex-end',gap:3,height:100}}>
        {D.LOAN_SCHEDULE.map((s,i)=>{
          const h=(s.amount/maxA)*100;
          const isNow=i===D.LOAN_SCHEDULE.filter(x=>x.status==='remitted'||x.status==='accrued').length-1;
          return (
            <div key={s.month} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-end',position:'relative',height:'100%'}}>
              {isNow&&<div style={{position:'absolute',top:-20,left:'50%',transform:'translateX(-50%)',fontFamily:'var(--sans)',fontSize:9,color:'var(--accent)',whiteSpace:'nowrap',fontWeight:500}}>▼ now</div>}
              <div style={{width:'100%',height:`${h}px`,background:STATUS_COLOR[s.status],borderRadius:'2px 2px 0 0',opacity:s.status==='projected'?.5:1,border:(s.status==='scheduled'||s.status==='projected')?'1px solid var(--rule-2)':'none'}}/>
            </div>
          );
        })}
      </div>
      <div style={{display:'flex',gap:3}}>
        {D.LOAN_SCHEDULE.map(s=>(
          <div key={s.month} style={{flex:1,textAlign:'center',fontSize:8.5,color:'var(--ink-4)',fontFamily:'var(--sans)',lineHeight:1.2}}>
            {new Date(s.month+'-01').toLocaleDateString('en-GB',{month:'short'})}<br/><span style={{fontSize:8}}>{s.month.slice(2,4)}</span>
          </div>
        ))}
      </div>
      <div style={{display:'flex',gap:18,paddingTop:4}}>
        {Object.entries(STATUS_LABEL).map(([k,v])=>(
          <div key={k} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:'var(--ink-3)',fontFamily:'var(--sans)'}}>
            <div style={{width:10,height:10,background:STATUS_COLOR[k],borderRadius:2,opacity:k==='projected'?.5:1,border:k==='scheduled'?'1px solid var(--rule-2)':'none'}}/>{v}
          </div>
        ))}
      </div>
    </div>
  );
}

function RetirementCurve() {
  const W=440,H=200,padL=46,padR=16,padT=16,padB=28;
  const iW=W-padL-padR,iH=H-padT-padB,total=D.LOAN_TOTAL_VND,xStep=iW/D.LOAN_SCHEDULE.length;
  let cum=0;
  const points=D.LOAN_SCHEDULE.map((s,i)=>{cum+=s.amount;return{x:padL+(i+1)*xStep,y:padT+iH-(cum/total)*iH,status:s.status};});
  const fullPath=`M ${padL} ${padT+iH} `+points.map(p=>`L ${p.x} ${p.y}`).join(' ');
  const area=fullPath+` L ${points[points.length-1].x} ${padT+iH} Z`;
  const splitIdx=D.LOAN_SCHEDULE.reduce((acc,s,i)=>(s.status==='remitted'||s.status==='accrued')?i:acc,-1);
  const splitX=splitIdx>=0?points[splitIdx].x:padL;
  const solidPath=`M ${padL} ${padT+iH} `+points.slice(0,splitIdx+1).map(p=>`L ${p.x} ${p.y}`).join(' ');
  const dashPath=`M ${points[splitIdx]?.x||padL} ${points[splitIdx]?.y||padT+iH} `+points.slice(splitIdx+1).map(p=>`L ${p.x} ${p.y}`).join(' ');
  return (

function AdvisorScreen({ tweaks }) {

  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;},[messages,busy]);

            <div className="eyebrow" style={{marginBottom:8}}>SIGNED</div>
            <div className="serif" style={{fontSize:13,color:'var(--ink-3)',fontStyle:'italic'}}>Meridian Advisory · prepared for you, weekdays 06:00 CET.</div>
          </div>
        </div>
      </div>
      <div className="panel" style={{borderTop:0,borderBottom:0,display:'flex',flexDirection:'column'}}>
        <div className="panel-h"><span className="title">LIVE CONSULTATION</span><span className="badge info">claude · haiku</span><span className="meta">{messages.length} exchanges</span></div>
        <div ref={scrollRef} style={{flex:1,overflow:'auto',padding:'0 20px'}}>

        <div style={{padding:14}}>

<script type="text/babel">
/* ===== MACRO SCREEN ===== */
(() => {
const D = window.MERIDIAN_DATA;

function trendDataFor(metric) {
  let seed=0;
  for(const c of metric.id)seed=(seed*31+c.charCodeAt(0))%1000;
  function rand(){seed=(seed*9301+49297)%233280;return seed/233280;}
  let v=parseFloat(metric.val.replace(/[^0-9.]/g,''))||100;
  const data=[];
  for(let i=0;i<32;i++){v*=1+(rand()-.5)*.012;data.push(v);}
  if(metric.trend==='up')data[data.length-1]*=1.005;
  if(metric.trend==='down')data[data.length-1]*=.995;
  return data;
}

function MiniSpark({data,color,height=28,width=110}){
  const min=Math.min(...data),max=Math.max(...data),range=max-min||1;
  const pts=data.map((v,i)=>[(i/(data.length-1))*width,height-((v-min)/range)*(height-4)-2]);
  const path=pts.map((p,i)=>`${i===0?'M':'L'} ${p[0]} ${p[1]}`).join(' ');
  return <svg width={width} height={height}><path d={path} stroke={color} strokeWidth="1.25" fill="none"/><circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2" fill={color}/></svg>;
}

function MetricCard({m}){
  const color=m.trend==='up'?'var(--up)':m.trend==='down'?'var(--down)':'var(--ink-3)';
  const data=trendDataFor(m);
  return(
    <div className="metric-card">
      <div className="top">
        <div><div className="name">{m.name}</div><div className="val">{m.val}</div></div>
        <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
          <span className={`badge ${m.trend==='up'?'up':m.trend==='down'?'down':''}`}>{m.trend==='up'?'▲':m.trend==='down'?'▼':'◆'} {m.delta}</span>
          <MiniSpark data={data} color={color}/>
        </div>
      </div>
      <div className="commentary">{m.commentary}</div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:4}}>
        <span className="mono ink4" style={{fontSize:9,letterSpacing:'0.1em'}}>LAST: {m.last.toUpperCase()}</span>
        <button className="btn ghost" style={{fontSize:9}}>ASK ADVISOR →</button>
      </div>
    </div>
  );
}

function MacroSection({title,metrics}){
  return(
    <div className="panel" style={{borderLeft:0,borderRight:0,borderTop:0}}>
      <div className="panel-h"><span className="title">{title}</span><span className="meta">{metrics.length} INDICATORS</span></div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:1,background:'var(--rule)'}}>
        {metrics.map(m=><div key={m.id} style={{background:'var(--panel)'}}><MetricCard m={m}/></div>)}
      </div>
    </div>
  );
}

function MacroScreen(){
  const groups={
    rates:{title:'POLICY RATES · CENTRAL BANKS',metrics:D.MACRO.filter(m=>m.group==='rates')},
    fx:{title:'FOREIGN EXCHANGE · LIVE',metrics:D.MACRO.filter(m=>m.group==='fx')},
    cpi:{title:'INFLATION · CPI (YOY)',metrics:D.MACRO.filter(m=>m.group==='cpi')},
    equity:{title:'EQUITY · INDICES',metrics:D.MACRO.filter(m=>m.group==='equity')},
    comm:{title:'COMMODITIES',metrics:D.MACRO.filter(m=>m.group==='comm')},
  };
  return(
    <div style={{background:'var(--rule)',minHeight:'100%'}}>
      <div style={{background:'var(--panel)',padding:'24px 28px',borderBottom:'1px solid var(--rule)'}}>
        <div className="eyebrow">MACRO CONTEXT</div>
        <div className="serif" style={{fontSize:28,fontStyle:'italic',lineHeight:1.2,color:'var(--ink)',marginTop:4}}>The world your money lives in — annotated.</div>
        <div className="serif" style={{fontSize:13,color:'var(--ink-3)',marginTop:6,maxWidth:760,lineHeight:1.5,fontStyle:'italic'}}>Every figure carries a one-line read: what it means for <em>your</em> situation today.</div>
      </div>
      {Object.values(groups).map((g,i)=><MacroSection key={i} title={g.title} metrics={g.metrics}/>)}
    </div>
  );
}

window.MacroScreen = MacroScreen;
})();
</script>

<script type="text/babel">
/* ===== GOALS SCREEN ===== */
(() => {
const D = window.MERIDIAN_DATA;

function GoalCard({goal}){
  const pct=(goal.saved/goal.target)*100,remaining=goal.target-goal.saved;
  const byDate=new Date(goal.by+'-01'),today=new Date(2026,4,27);
  const monthsUntil=Math.max(1,Math.round((byDate-today)/(1000*60*60*24*30)));

  return(
    <div style={{background:'var(--panel)',padding:24,display:'flex',flexDirection:'column',gap:16,minHeight:280}}>

        <div className="badge">{goal.by.toUpperCase()}</div>
      </div>
      <div>
        <div className="row-between" style={{marginBottom:6}}>
          <span className="mono" style={{fontSize:18,color:'var(--accent)'}}>{D.fmt(goal.saved,goal.ccy,{decimals:0})}</span>
          <span className="mono ink3" style={{fontSize:11}}>of {D.fmt(goal.target,goal.ccy,{decimals:0})}</span>
        </div>
        <div className="bar tall"><div className="bar-fill" style={{width:`${pct}%`,background:'var(--accent)'}}></div></div>
        <div className="row-between" style={{marginTop:4}}>
          <span className="mono ink3" style={{fontSize:10}}>{pct.toFixed(1)}% complete</span>
          <span className="mono ink3" style={{fontSize:10}}>{D.fmt(remaining,goal.ccy,{decimals:0})} to go</span>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:1,background:'var(--rule)',border:'1px solid var(--rule)'}}>
        <div style={{padding:10,background:'var(--panel-2)'}}><div className="eyebrow">MONTHS LEFT</div><div className="mono" style={{fontSize:18,color:'var(--ink)',marginTop:2}}>{monthsUntil}</div></div>
        <div style={{padding:10,background:'var(--panel-2)'}}><div className="eyebrow">REQUIRED / MO</div><div className="mono" style={{fontSize:18,color:'var(--ink)',marginTop:2}}>€{requiredMonthly.toFixed(0)}</div></div>
      </div>
      <div className="serif ink2" style={{fontSize:12,fontStyle:'italic',lineHeight:1.5,borderLeft:'2px solid var(--accent)',paddingLeft:12}}>
        {goal.id==='g1'&&"Wedding budget pacing: behind plan. Once the debt to mom drops to <50% of monthly outflow (Q3 '26), redirect ~€350/mo here."}
        {goal.id==='g2'&&"Half-built — €9,420 covers ~3 months of essentials. Target six months. Don't touch unless EUR/VND moves >5% against you."}
        {goal.id==='g3'&&"Joint with partner. After debt-free (Jun '27), this becomes priority one. Realistically a 2028-29 purchase."}
      </div>
    </div>
  );
}

function AllocationDraft(){

    {lbl:'Emergency top-up',pct:20,eur:540,color:'var(--info)',note:'until 6 mo coverage'},
    {lbl:'House deposit',pct:40,eur:1080,color:'var(--accent)',note:'joint with partner'},

        <div key={i} style={{display:'flex',flexDirection:'column',gap:5}}>

            <span className="mono" style={{fontSize:12}}><span style={{color:it.color}}>€{it.eur}</span><span className="ink3"> · {it.pct}%</span></span>
          </div>

          <div className="mono ink4" style={{fontSize:9}}>{it.note}</div>

function GoalsScreen(){
  return(
    <div style={{background:'var(--rule)',minHeight:'100%'}}>
      <div style={{background:'var(--panel)',padding:'24px 28px',borderBottom:'1px solid var(--rule)'}}>
        <div className="eyebrow">SAVINGS GOALS</div>
        <div className="serif" style={{fontSize:28,fontStyle:'italic',lineHeight:1.2,color:'var(--ink)',marginTop:4}}>What you're building toward.</div>
        <div className="serif" style={{fontSize:13,color:'var(--ink-3)',marginTop:6,fontStyle:'italic'}}>Three concurrent goals, prioritized: emergency fund first, wedding next, house after Jun '27.</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:1,background:'var(--rule)'}}>
        {D.GOALS.map(g=><GoalCard key={g.id} goal={g}/>)}
      </div>
      <div className="panel" style={{border:0}}>
        <div className="panel-h"><span className="title">CAPITAL ALLOCATION · POST-DEBT (JUN '27 →)</span><span className="meta">DRAFT PLAN — REVISIT WITH ADVISOR</span></div>
        <div className="panel-b" style={{display:'grid',gridTemplateColumns:'1.4fr 1fr',gap:24}}>
          <AllocationDraft/>
          <div className="serif" style={{fontSize:13.5,lineHeight:1.65,color:'var(--ink-2)',fontStyle:'italic'}}>
            <p>Once the debt to mom is retired, your monthly €2,600–2,700 of debt service becomes free capital. The plan below reallocates it: top off emergency to six months, accelerate the house deposit, and start the equity sleeve modestly while learning the discipline.</p>
            <p>This is a draft. Sit with the advisor to pressure-test it once you're within four months of debt-free.</p>
          </div>
        </div>
      </div>
    </div>
  );
}

window.GoalsScreen = GoalsScreen;
})();
</script>

<script type="text/babel">
/* ===== MERIDIAN TWEAKS + APP SHELL ===== */
(() => {
const { TweaksPanel, TweakSection, TweakSelect, TweakRadio, TweakColor } = window;

function MeridianTweaks({ tweaks, setTweak }) {
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection label="Theme"/>
      <TweakRadio label="Mode" value={tweaks.theme} options={['dark','light']} onChange={v=>setTweak('theme',v)}/>
      <TweakColor label="Accent" value={tweaks.accent} options={['#D07090','#C05878','#7AB888','#6AAABB','#D4A060','#A85070']} onChange={v=>setTweak('accent',v)}/>
      <TweakSection label="Density"/>
      <TweakRadio label="Spacing" value={tweaks.density} options={['compact','normal','spacious']} onChange={v=>setTweak('density',v)}/>
      <TweakSection label="Typography"/>
      <TweakSelect label="UI sans" value={tweaks.uiFont} options={['Geist','IBM Plex Sans','Inter Tight']} onChange={v=>setTweak('uiFont',v)}/>
      <TweakSelect label="Data mono" value={tweaks.dataFont} options={['JetBrains Mono','IBM Plex Mono','Geist Mono']} onChange={v=>setTweak('dataFont',v)}/>
      <TweakSelect label="Editorial serif" value={tweaks.serifFont} options={['Newsreader','Instrument Serif','EB Garamond','Spectral']} onChange={v=>setTweak('serifFont',v)}/>
      <TweakSection label="Advisor"/>
      <TweakSelect label="Tone" value={tweaks.advisorTone} options={['Calm & analytical','Direct & blunt','Friendly coach','Macro-nerd peer']} onChange={v=>setTweak('advisorTone',v)}/>
    </TweaksPanel>
  );
}

const { useState, useEffect, useMemo } = React;
const D = window.MERIDIAN_DATA;

const Icon = {
  overview: p=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M3 13h7V3H3v10zm0 8h7v-6H3v6zm9 0h9v-9h-9v9zm0-18v7h9V3h-9z"/></svg>,
  ledger:   p=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M5 3h11l3 3v15H5V3z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>,
  debt:     p=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M4 12h16M4 12l4-4M4 12l4 4M20 6v12"/></svg>,
  advisor:  p=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M4 5h16v12H7l-3 3V5z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></svg>,
  macro:    p=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><path d="M3 17l6-6 4 4 8-8M21 7h-5M21 7v5"/></svg>,
  goals:    p=><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" {...p}><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>,
};

const NAV = [
  { id:'overview', tip:'Overview',    icon:Icon.overview },
  { id:'ledger',   tip:'Ledger',      icon:Icon.ledger },
  { id:'debt',     tip:'Debt to mom', icon:Icon.debt },
  { id:'goals',    tip:'Goals',       icon:Icon.goals },
  { id:'advisor',  tip:'Advisor',     icon:Icon.advisor },
  { id:'macro',    tip:'Macro',       icon:Icon.macro },
];

function TopBar({ screen, theme, setTheme, now }) {
  const labels = { overview:'Overview', ledger:'Ledger', debt:'Debt to mom', goals:'Goals', advisor:'Advisor', macro:'Macro' };
  return (
    <header className="topbar">
      <div className="brand"><span className="dot"></span><span>Meridian</span></div>
      <div className="crumbs">{labels[screen]||screen}</div>
      <div className="right">
        <div className="fx">
          <span><span className="pair">EUR/USD</span> <span className="val">{D.FX.EURUSD.toFixed(4)}</span></span>
          <span><span className="pair">EUR/VND</span> <span className="val">{D.FX.EURVND.toLocaleString()}</span></span>
          <span><span className="pair">USD/VND</span> <span className="val">{D.FX.USDVND.toLocaleString()}</span></span>
        </div>
        <span style={{color:'var(--ink-4)'}}>·</span>
        <span>{now}</span>
        <span style={{color:'var(--ink-4)'}}>·</span>
        <button className="theme-toggle" onClick={()=>setTheme(theme==='dark'?'light':'dark')}>{theme==='dark'?'Light':'Dark'}</button>
      </div>
    </header>
  );
}

function SideNav({ screen, setScreen }) {
  return (
    <aside className="sidebar">
      {NAV.map(n=>{const I=n.icon;return(
        <button key={n.id} className={'nav-btn'+(screen===n.id?' active':'')} onClick={()=>setScreen(n.id)} aria-label={n.tip}>
          <I/><span className="tip">{n.tip}</span>
        </button>
      );})}
    </aside>
  );
}

function App() {
  const tweakDefaults = { theme:'light', density:'normal', accent:'#D07090', uiFont:'Geist', dataFont:'JetBrains Mono', serifFont:'Newsreader', advisorTone:'Calm & analytical', chartStyle:'lines', layout:'panels' };
  const [tweaks,setTweak] = window.useTweaks(tweakDefaults);
  const [screen,setScreen] = useState('overview');
  const [now,setNow] = useState('');

  // Shared state lifted so Overview + Ledger stay in sync
  const [allEntries,setAllEntries] = useState(()=>{
    try{const s=localStorage.getItem('meridian_entries');return s?JSON.parse(s):D.ENTRIES;}catch{return D.ENTRIES;}
  });
  const [monthlyInputs,setMonthlyInputs] = useState(()=>{
    try{const s=localStorage.getItem('meridian_monthly_inputs');return s?JSON.parse(s):D.MONTHLY_INPUTS.map(m=>({...m}));}catch{return D.MONTHLY_INPUTS.map(m=>({...m}));}
  });
  function onAdd(entry){setAllEntries(s=>{const n=[entry,...s];try{localStorage.setItem('meridian_entries',JSON.stringify(n));}catch{}return n;});}
  function updateMonthlyInput(month,key,value){setMonthlyInputs(prev=>{const n=prev.map(m=>m.month===month?{...m,[key]:value}:m);try{localStorage.setItem('meridian_monthly_inputs',JSON.stringify(n));}catch{}return n;});}

  useEffect(()=>{document.documentElement.dataset.theme=tweaks.theme;document.documentElement.dataset.density=tweaks.density;},[tweaks.theme,tweaks.density]);
  useEffect(()=>{document.documentElement.style.setProperty('--accent',tweaks.accent);},[tweaks.accent]);
  useEffect(()=>{document.documentElement.style.setProperty('--sans',`'${tweaks.uiFont}', system-ui, sans-serif`);document.documentElement.style.setProperty('--mono',`'${tweaks.dataFont}', ui-monospace, monospace`);document.documentElement.style.setProperty('--serif',`'${tweaks.serifFont}', Georgia, serif`);},[tweaks.uiFont,tweaks.dataFont,tweaks.serifFont]);
  useEffect(()=>{
    function tick(){
      const d=new Date();
      const dateStr=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
      const timeStr=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      setNow(`${dateStr} · ${timeStr}`);
    }
    tick();
    const t=setInterval(tick,1000);
    return()=>clearInterval(t);
  },[]);

  const sharedProps={allEntries,onAdd,monthlyInputs,updateMonthlyInput};
  const ScreenComp = useMemo(()=>({overview:window.OverviewScreen,ledger:window.LedgerScreen,debt:window.DebtScreen,goals:window.GoalsScreen,advisor:window.AdvisorScreen,macro:window.MacroScreen}[screen]),[screen]);

  return (
    <div className="app">
      <TopBar screen={screen} theme={tweaks.theme} setTheme={v=>setTweak('theme',v)} now={now}/>
      <SideNav screen={screen} setScreen={setScreen}/>
      <main className="main" data-screen-label={screen}>
        {ScreenComp?<ScreenComp tweaks={tweaks} setTweak={setTweak} {...sharedProps}/>:<div style={{padding:40,color:'var(--ink-3)'}}>Screen not found.</div>}
      </main>
      <MeridianTweaks tweaks={tweaks} setTweak={setTweak}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
})();
</script>

</body>
</html>
